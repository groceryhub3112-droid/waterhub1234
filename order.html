<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order - WATER HUB 2.0</title>

<style>
body{
font-family:Arial,sans-serif;
background:#eef8ff;
padding:20px;
text-align:center;
}
.box{
max-width:400px;
margin:auto;
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}
input,select{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}
button{
width:100%;
padding:15px;
background:#00aa55;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
<h2>💧 WATER HUB 2.0</h2>
<h3>Order Form</h3>

<input id="name" placeholder="আপনার নাম">

<input id="phone" placeholder="মোবাইল নম্বর">

<input id="address" placeholder="ঠিকানা">

<select id="size">
<option>250 ml</option>
<option>500 ml</option>
<option>1 Litre</option>
<option>2 Litre</option>
<option>5 Litre</option>
<option>10 Litre</option>
<option>20 Litre</option>
</select>

<input id="qty" type="number" placeholder="কতটি লাগবে">

<button onclick="sendOrder()">📲 WhatsApp Order</button>

</div>

<script>
function sendOrder(){

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let address=document.getElementById("address").value;
let size=document.getElementById("size").value;
let qty=document.getElementById("qty").value;

let msg=
"💧 WATER HUB 2.0%0A%0A"+
"নাম: "+name+"%0A"+
"মোবাইল: "+phone+"%0A"+
"ঠিকানা: "+address+"%0A"+
"বোতল: "+size+"%0A"+
"পরিমাণ: "+qty;

window.open("https://wa.me/917866945566?text="+msg);

}
</script>

</body>
</html>
