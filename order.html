<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order - WATER HUB 2.0</title>

<style>

body{
font-family:Arial,sans-serif;
background:#eef8ff;
padding:20px;
text-align:center;
margin:0;
}

.box{
max-width:520px;
margin:auto;
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.15);
}

h2{
font-size:28px;
margin-bottom:5px;
}

h3{
margin-top:10px;
}

.cart-title{
color:#0077cc;
font-size:22px;
margin-top:20px;
}

.cart-item{
background:#f5faff;
border:1px solid #d9ecff;
border-radius:15px;
padding:15px;
margin:10px 0;
text-align:left;
}

.cart-item-name{
font-size:18px;
font-weight:bold;
color:#222;
}

.cart-item-info{
margin-top:6px;
color:#555;
font-size:16px;
}

.cart-item-total{
margin-top:6px;
font-weight:bold;
color:#0077cc;
}

.empty-cart{
background:#fff3f3;
color:#e53935;
padding:15px;
border-radius:12px;
margin:15px 0;
}

#totalPrice{
color:#e53935;
font-size:24px;
font-weight:bold;
margin:20px 0;
}

input{
width:100%;
padding:14px;
margin:8px 0;
border-radius:12px;
border:1px solid #ccc;
font-size:16px;
box-sizing:border-box;
}

label{
display:block;
text-align:left;
font-weight:bold;
margin-top:12px;
}

button{
width:100%;
padding:15px;
background:#00aa55;
color:white;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

.back-btn{
display:block;
background:#0d6efd;
color:white;
text-decoration:none;
padding:13px;
border-radius:12px;
margin-top:12px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="box">

<h2>💧 WATER HUB 2.0</h2>

<h3>🛒 আপনার অর্ডার</h3>

<div id="cartItems"></div>

<h3 id="totalPrice">
💰 Total Price: ₹0
</h3>

<hr>

<h3>📦 Delivery Details</h3>

<input id="name" placeholder="আপনার নাম">

<input id="phone" placeholder="মোবাইল নম্বর" type="tel">

<input id="address" placeholder="ঠিকানা">

<label>📅 Delivery Date</label>
<input id="date" type="date">

<label>🕒 Delivery Time</label>
<input id="time" type="time">

<button onclick="sendOrder()">
📲 WhatsApp Order
</button>

<a href="index.html" class="back-btn">
🛒 আরও পণ্য দেখুন
</a>

</div>

<script>

const prices = {
    "250 ml Water":120,
    "500 ml Water":110,
    "1 Litre Water":90,
    "2 Litre Water":110,
    "5 Litre Water":38,
    "10 Litre Water":58,
    "20 Litre Water":40
};


function getCart(){

    let data = localStorage.getItem("cart");

    if(!data){
        data = localStorage.getItem("cartItems");
    }

    if(!data){
        data = localStorage.getItem("shoppingCart");
    }

    if(!data){
        return [];
    }

    try{
        return JSON.parse(data);
    }
    catch(e){
        return [];
    }
}


function showCart(){

    let cart = getCart();

    let box = document.getElementById("cartItems");

    let products = {};

    let total = 0;


    /* Cart-এর সব product হিসাব করা */

    cart.forEach(item => {

        let name = "";
        let price = 0;
        let qty = 1;


        if(typeof item === "object"){

            name =
                item.name ||
                item.product ||
                item.title ||
                "";

            price =
                Number(item.price) ||
                prices[name] ||
                0;

            /* নতুন Cart-এর quantity */

            qty =
                Number(item.quantity) ||
                Number(item.qty) ||
                1;

        }else{

            name = item;

            price = prices[name] || 0;

            qty = 1;

        }


        if(!name) return;


        /* একই product একসাথে করা */

        if(products[name]){

            products[name].qty += qty;

        }else{

            products[name] = {
                price:price,
                qty:qty
            };

        }

    });


    box.innerHTML = `
    <div class="cart-title">
    🛒 আপনি যা অর্ডার করেছেন
    </div>
    `;


    Object.keys(products).forEach(name => {

        let qty = products[name].qty;

        let price = products[name].price;

        let itemTotal = qty * price;

        total += itemTotal;


        box.innerHTML += `

        <div class="cart-item">

            <div class="cart-item-name">
            💧 ${name}
            </div>

            <div class="cart-item-info">
            পরিমাণ: <b>${qty} টি</b> × ₹${price}
            </div>

            <div class="cart-item-total">
            মোট: ₹${itemTotal}
            </div>

        </div>

        `;

    });


    document.getElementById("totalPrice").innerHTML =
        "💰 Total Price: ₹" + total;

}


function sendOrder(){

let name =
document.getElementById("name").value.trim();

let phone =
document.getElementById("phone").value.trim();

let address =
document.getElementById("address").value.trim();

let date =
document.getElementById("date").value;

let time =
document.getElementById("time").value;


if(!name || !phone || !address || !date || !time){

alert("সব তথ্য পূরণ করুন।");

return;

}


let cart = getCart();


if(cart.length === 0){

alert("আপনার Cart খালি।");

return;

}


let products = {};

let total = 0;


/* PRODUCTS COUNT */

cart.forEach(item => {

let productName = "";
let price = 0;


if(typeof item === "object"){

productName =
item.name ||
item.product ||
item.title ||
"Unknown Product";

price =
Number(item.price) ||
prices[productName] ||
0;

}else{

productName = item;

price = prices[productName] || 0;

}


if(!products[productName]){

products[productName] = {
qty:0,
price:price
};

}

products[productName].qty++;

});


/* CREATE HISTORY PRODUCTS */

let historyProducts = [];


Object.keys(products).forEach(productName => {

let qty =
products[productName].qty;

let price =
products[productName].price;

let itemTotal =
qty * price;

total += itemTotal;


historyProducts.push({

name: productName,

quantity: qty,

price: price,

total: itemTotal

});

});


/* SAVE ORDER HISTORY */

let orderHistory =
JSON.parse(localStorage.getItem("orderHistory")) || [];


let newOrder = {

date: date + " " + time,

products: historyProducts,

total: total

};


orderHistory.push(newOrder);


localStorage.setItem(
"orderHistory",
JSON.stringify(orderHistory)
);


/* WHATSAPP MESSAGE */

let msg = `💧 WATER HUB 2.0

🛒 নতুন অর্ডার

━━━━━━━━━━━━━━

👤 নাম: ${name}

📞 মোবাইল: ${phone}

📍 ঠিকানা: ${address}

━━━━━━━━━━━━━━

📦 অর্ডারের তালিকা:

`;


Object.keys(products).forEach(productName => {

let qty =
products[productName].qty;

let price =
products[productName].price;

let itemTotal =
qty * price;


msg += `💧 ${productName}
পরিমাণ: ${qty} টি
দাম: ₹${price}
মোট: ₹${itemTotal}

`;

});


msg += `
━━━━━━━━━━━━━━

💰 সর্বমোট: ₹${total}

📅 Delivery Date: ${date}

🕒 Delivery Time: ${time}

━━━━━━━━━━━━━━

ধন্যবাদ ❤️
WATER HUB 2.0
`;


/* OPEN WHATSAPP */

let url =
"https://api.whatsapp.com/send?phone=917866945566&text="
+ encodeURIComponent(msg);


location.href = url;

}

</script>
</body>
</html>
