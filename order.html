<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order - WATER HUB 2.0</title>

<style>

body{
font-family:Arial,sans-serif;
background:#eef8ff;
padding:20px;
text-align:center;
margin:0;
}

.box{
max-width:520px;
margin:auto;
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.15);
}

h2{
font-size:28px;
margin-bottom:5px;
}

.cart-title{
color:#0077cc;
font-size:22px;
margin-top:20px;
}

.cart-item{
background:#f5faff;
border:1px solid #d9ecff;
border-radius:15px;
padding:15px;
margin:10px 0;
text-align:left;
}

.cart-item-name{
font-size:18px;
font-weight:bold;
color:#222;
}

.cart-item-info{
margin-top:6px;
color:#555;
font-size:16px;
}

.cart-item-total{
margin-top:6px;
font-weight:bold;
color:#0077cc;
}

.empty-cart{
background:#fff3f3;
color:#e53935;
padding:15px;
border-radius:12px;
margin:15px 0;
}

#totalPrice{
color:#e53935;
font-size:24px;
font-weight:bold;
margin:20px 0;
}

input{
width:100%;
padding:14px;
margin:8px 0;
border-radius:12px;
border:1px solid #ccc;
font-size:16px;
box-sizing:border-box;
}

label{
display:block;
text-align:left;
font-weight:bold;
margin-top:12px;
}

button{
width:100%;
padding:15px;
background:#00aa55;
color:white;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

.back-btn{
display:block;
background:#0d6efd;
color:white;
text-decoration:none;
padding:13px;
border-radius:12px;
margin-top:12px;
font-weight:bold;
}

.history-btn{
display:block;
background:#6a1b9a;
color:white;
text-decoration:none;
padding:13px;
border-radius:12px;
margin-top:12px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="box">

<h2>💧 WATER HUB 2.0</h2>

<h3>🛒 আপনার অর্ডার</h3>

<div id="cartItems"></div>

<h3 id="totalPrice">
💰 Total Price: ₹0
</h3>

<hr>

<h3>📦 Delivery Details</h3>

<input id="name" placeholder="আপনার নাম">

<input id="phone" placeholder="মোবাইল নম্বর" type="tel">

<input id="address" placeholder="ঠিকানা">

<label>📅 Delivery Date</label>
<input id="date" type="date">

<label>🕒 Delivery Time</label>
<input id="time" type="time">

<button onclick="sendOrder()">
📲 WhatsApp Order
</button>

<a href="history.html" class="history-btn">
📋 Order History
</a>

<a href="index.html" class="back-btn">
🛒 আরও পণ্য দেখুন
</a>

</div>


<script>

/* =========================
   GET CART
========================= */

function getCart(){

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

return cart;

}


/* =========================
   SHOW CART
========================= */

function showCart(){

let cart = getCart();

let box = document.getElementById("cartItems");

let total = 0;

if(cart.length === 0){

box.innerHTML = `
<div class="empty-cart">
🛒 আপনার Cart খালি।
</div>
`;

document.getElementById("totalPrice").innerHTML =
"💰 Total Price: ₹0";

return;

}


/* একই Product একসাথে করা */

let products = {};

cart.forEach(item => {

let name = item.name;

let price = Number(item.price);

let qty = Number(item.qty || 1);


/* একই নামের Product থাকলে quantity যোগ হবে */

if(products[name]){

products[name].qty += qty;

}else{

products[name] = {
price: price,
qty: qty
};

}

});


box.innerHTML = `
<div class="cart-title">
🛒 আপনি যা অর্ডার করেছেন
</div>
`;


/* Product দেখানো */

Object.keys(products).forEach(name => {

let price = products[name].price;

let qty = products[name].qty;

let itemTotal = price * qty;

total += itemTotal;

box.innerHTML += `

<div class="cart-item">

<div class="cart-item-name">
💧 ${name}
</div>

<div class="cart-item-info">
পরিমাণ: ${qty} টি × ₹${price}
</div>

<div class="cart-item-total">
মোট: ₹${itemTotal}
</div>

</div>

`;

});


document.getElementById("totalPrice").innerHTML =
"💰 Total Price: ₹" + total;

}


/* =========================
   SEND ORDER
========================= */

function sendOrder(){

let name =
document.getElementById("name").value.trim();

let phone =
document.getElementById("phone").value.trim();

let address =
document.getElementById("address").value.trim();

let date =
document.getElementById("date").value;

let time =
document.getElementById("time").value;


if(!name || !phone || !address || !date || !time){

alert("সব তথ্য পূরণ করুন।");

return;

}


let cart = getCart();


if(cart.length === 0){

alert("আপনার Cart খালি।");

return;

}


let total = 0;

let historyProducts = [];


/* =========================
   CREATE ORDER PRODUCTS
========================= */

cart.forEach(item => {

let name =
item.name;

let price =
Number(item.price);

let qty =
Number(item.qty || 1);

let itemTotal =
price * qty;

total += itemTotal;


historyProducts.push({

name:name,

quantity:qty,

price:price,

total:itemTotal

});

});


/* =========================
   SAVE ORDER HISTORY
========================= */

let orderHistory =
JSON.parse(
localStorage.getItem("orderHistory")
) || [];


let newOrder = {

customerName:name,

phone:phone,

address:address,

deliveryDate:date,

deliveryTime:time,

products:historyProducts,

total:total,

orderDate:new Date().toLocaleString()

};


orderHistory.push(newOrder);


localStorage.setItem(
"orderHistory",
JSON.stringify(orderHistory)
);


/* =========================
   WHATSAPP MESSAGE
========================= */

let msg = `💧 WATER HUB 2.0

🛒 নতুন অর্ডার

━━━━━━━━━━━━━━

👤 নাম: ${name}

📞 মোবাইল: ${phone}

📍 ঠিকানা: ${address}

━━━━━━━━━━━━━━

📦 অর্ডারের তালিকা:

`;


historyProducts.forEach(product => {

msg += `💧 ${product.name}
পরিমাণ: ${product.quantity} টি
দাম: ₹${product.price}
মোট: ₹${product.total}

`;

});


msg += `
━━━━━━━━━━━━━━

💰 সর্বমোট: ₹${total}

📅 Delivery Date: ${date}

🕒 Delivery Time: ${time}

━━━━━━━━━━━━━━

ধন্যবাদ ❤️
WATER HUB 2.0
`;


/* =========================
   OPEN WHATSAPP
========================= */

let url =
"https://api.whatsapp.com/send?phone=917866945566&text="
+ encodeURIComponent(msg);

location.href = url;

}


/* =========================
   LOAD
========================= */

showCart();

</script>

</body>
</html>
