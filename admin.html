<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WATER HUB Admin</title>
<style>
body{
font-family:Arial,sans-serif;
background:#eef8ff;
padding:20px;
}
.box{
max-width:450px;
margin:auto;
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}
input,button{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}
button{
background:#0099ff;
color:#fff;
border:none;
font-weight:bold;
}
</style>
</head>
<body>

<div class="box">

<h2>💧 WATER HUB 2.0 Admin</h2>

<input id="password" type="password" placeholder="Admin Password">

<button onclick="login()">Login</button>

<p id="msg"></p>

</div>

<script>
function login(){

let pass=document.getElementById("password").value;

if(pass==="Hub$water@2026#"){
location.href="dashboard.html";
}else{
document.getElementById("msg").innerHTML="❌ Wrong Password";
}

}
</script>

</body>
</html>
